# ZenBox — legacy Hyprland .conf (Omarchy 3.x / pre-Lua).
# Source from hyprland.conf:  source = ~/.config/hypr/zenbox.conf

# Super+Shift+Z is unused in stock Omarchy bindings.
bind = SUPER SHIFT, Z, exec, zenbox
bind = SUPER SHIFT ALT, Z, exec, zenbox add

windowrulev2 = float, class:^(zenbox)$
windowrulev2 = size 420 100%, class:^(zenbox)$
windowrulev2 = move 100%-430 0, class:^(zenbox)$
windowrulev2 = opacity 1.0 override 1.0 override, class:^(zenbox)$

windowrulev2 = float, title:^(ZenBox)$
windowrulev2 = size 420 100%, title:^(ZenBox)$
windowrulev2 = move 100%-430 0, title:^(ZenBox)$
