<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1b26" />
  <title>Inbox — Omarchy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Omarchy Tokyo Night tokens (from omarchy themes/tokyo-night/colors.toml) */
    :root {
      --accent: #7aa2f7;
      --selection: #292e42;
      --muted: #414868;
      --bg: #1a1b26;
      --bg-dark: #13141c;
      --bg-darker: #0e0e14;
      --bg-light: #24283b;
      --fg: #a9b1d6;
      --fg-dark: #565f89;
      --fg-light: #b4bee6;
      --fg-bright: #c0caf5;
      --red: #f7768e;
      --yellow: #e0af68;
      --orange: #eb927b;
      --green: #9ece6a;
      --cyan: #449dab;
      --blue: #7aa2f7;
      --magenta: #ad8ee6;
      --border: #292e42;
      --gap: 8px;
      --bar-h: 28px;
      --radius: 0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: "IBM Plex Mono", ui-monospace, monospace; color: var(--fg); background: var(--bg-darker); }
    function navigateKanban PLACEHOLDER_NEED_FULL_FILE
  </style>
</head>
